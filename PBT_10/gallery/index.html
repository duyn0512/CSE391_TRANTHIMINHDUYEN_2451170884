<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Tối ưu hiệu ứng cho Lazy Loading */
        .gallery-img {
            min-height: 200px;
            background-color: #f0f0f0;
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            cursor: pointer;
        }
        .gallery-img.loaded {
            opacity: 1;
        }
        /* Zoom nhẹ khi hover ảnh cho đẹp mắt */
        .card-img-wrapper {
            overflow: hidden;
            border-radius: var(--bs-card-border-radius);
        }
        .gallery-img:hover {
            transform: scale(1.03);
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="text-center mb-5 fw-bold text-primary">INFINITE SCROLL GALLERY</h1>
        
        <div id="gallery-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
            </div>

        <div id="load-trigger" class="text-center my-5 py-3">
            <div id="loading-spinner" class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải thêm...</span>
            </div>
            <p class="text-muted mt-2 small" id="loading-text">Đang tải thêm ảnh...</p>
        </div>
    </div>

    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-dark text-white border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="lightboxTitle">Chi tiết ảnh</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-0">
                    <img src="" id="lightboxImage" class="img-fluid w-100 object-fit-contain" style="max-height: 80vh;" alt="Large view">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
