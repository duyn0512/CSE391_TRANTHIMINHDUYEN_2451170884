<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light min-vh-screen py-5">

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
            <div>
                <h1 class="fw-extrabold tracking-tight text-dark mb-1">📋 User Directory</h1>
                <p class="text-muted mb-0 small">Hệ thống quản lý thông tin thành viên nội bộ</p>
            </div>
            <button class="btn btn-primary-custom px-4 py-2.5 fw-semibold d-flex align-items-center gap-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#userModal" id="btn-add-user">
                <span>➕</span> Thêm thành viên
            </button>
        </div>

        <div class="card card-custom p-3 shadow-sm mb-4">
            <div class="position-relative">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Tìm kiếm thành viên theo tên hoặc email của họ..." 
                    class="form-control form-control-custom py-2.5 ps-4 pe-5"
                >
                <span class="position-absolute end-0 top-50 translate-middle-y me-3 text-secondary" style="pointer-events: none;">🔍</span>
            </div>
        </div>

        <div class="row g-4" id="users-grid">
            </div>
    </div>

    <div class="modal fade" id="userModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-custom border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold text-dark" id="modalTitle">Thêm thành viên mới</h5>
                    <button type="button" class="btn-close" data-bs-shadow="none" data-bs-dismiss="modal" aria-label="Close" id="btn-close-modal-x"></button>
                </div>
                <form id="user-form">
                    <div class="modal-body p-4">
                        <input type="hidden" id="form-user-id" value="">

                        <div class="mb-3">
                            <label for="form-name" class="form-label text-muted fw-bold small text-uppercase tracking-wider">Họ và tên</label>
                            <input type="text" class="form-control form-control-custom py-2" id="form-name" placeholder="Nhập tên đầy đủ..." required>
                        </div>
                        <div class="mb-3">
                            <label for="form-email" class="form-label text-muted fw-bold small text-uppercase tracking-wider">Địa chỉ Email</label>
                            <input type="email" class="form-control form-control-custom py-2" id="form-email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="form-phone" class="form-label text-muted fw-bold small text-uppercase tracking-wider">Số điện thoại</label>
                            <input type="text" class="form-control form-control-custom py-2" id="form-phone" placeholder="Nhập số điện thoại..." required>
                        </div>
                        <div class="mb-0">
                            <label for="form-company" class="form-label text-muted fw-bold small text-uppercase tracking-wider">Tên công ty / Tổ chức</label>
                            <input type="text" class="form-control form-control-custom py-2" id="form-company" placeholder="Nhập tên doanh nghiệp làm việc..." required>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0 pb-4 px-4 gap-2">
                        <button type="button" class="btn btn-light px-4 py-2 fw-semibold rounded-3 text-secondary border" data-bs-dismiss="modal" id="btn-close-modal">Hủy</button>
                        <button type="submit" class="btn btn-primary-custom px-4 py-2 fw-semibold shadow-sm" id="btn-submit-form">Lưu thông tin</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060;">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
