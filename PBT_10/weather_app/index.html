<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-animate min-vh-screen d-flex align-items-center justify-content-center p-3">

    <div class="card card-custom p-4 shadow-lg w-100" style="max-width: 420px;">
        
        <h1 class="fs-4 fw-extrabold text-center text-dark mb-4 tracking-tight">
            <span class="d-inline-block animate-bounce">🌤️</span> Weather App
        </h1>

        <form id="search-form" class="d-flex gap-2 mb-4">
            <div class="position-relative flex-grow-1">
                <input 
                    type="text" 
                    id="city-input" 
                    placeholder="Nhập tên thành phố (vd: Hanoi, Nghe An)..." 
                    class="form-control form-control-custom py-2.5 ps-3 pe-5 text-sm"
                    required
                >
                <span class="position-absolute end-0 top-50 translate-middle-y me-3 text-secondary" style="font-size: 12px; pointer-events: none;">🔍</span>
            </div>
            <button 
                type="submit" 
                class="btn btn-primary-custom px-4 py-2.5 fw-semibold text-sm transition-all"
            >
                Tìm
            </button>
        </form>

        <div class="mb-4">
            <p class="text-uppercase tracking-wider text-muted fw-bold mb-2" style="font-size: 11px;">Lịch sử tìm kiếm</p>
            <div id="history-container" class="d-flex flex-wrap gap-2" style="min-height: 28px;">
                </div>
        </div>

        <div class="w-100 bg-gradient-line mb-4" style="height: 1px;"></div>

        <div id="weather-status-content">
            
            <div id="state-empty" class="text-center text-muted py-4">
                <div class="fs-1 mb-2">🗺️</div>
                <p class="small fw-medium">Nhập một địa điểm để xem thông tin thời tiết.</p>
            </div>

            <div id="state-loading" class="hidden text-center py-4">
                <div class="spinner-border text-primary mb-3" role="status" style="width: 2.5rem; height: 2.5rem;">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="text-secondary fw-semibold small">Đang tải dữ liệu thời tiết...</p>
            </div>

            <div id="state-success" class="hidden text-center animation-fade-in">
                <h2 id="w-city" class="h4 fw-bold text-dark mb-0">Hà Nội</h2>
                <p id="w-description" class="badge bg-light text-primary border border-primary-subtle rounded-pill mt-2 px-3 py-2 text-uppercase tracking-wide" style="font-size: 10px;">Bầu trời quang đãng</p>
                
                <div class="my-4 d-flex align-items-center justify-content-center gap-3">
                    <span id="w-icon" class="fs-1 select-none">☀️</span>
                    <div class="text-start leading-none">
                        <span id="w-temp" class="fw-extrabold text-dark tracking-tighter" style="font-size: 3.5rem;">--</span>
                        <span class="fs-4 fw-bold text-secondary position-relative" style="top: -1.5rem;">°C</span>
                    </div>
                </div>

                <div class="row g-2 mt-2">
                    <div class="col-6">
                        <div class="p-3 text-start border rounded-4 bg-white-50">
                            <p class="text-muted text-uppercase fw-bold mb-1" style="font-size: 10px;">💧 Độ ẩm</p>
                            <p id="w-humidity" class="fw-bold text-dark h5 mb-0">--</p>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 text-start border rounded-4 bg-white-50">
                            <p class="text-muted text-uppercase fw-bold mb-1" style="font-size: 10px;">💨 Tốc độ gió</p>
                            <p id="w-wind" class="fw-bold text-dark h5 mb-0">--</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="state-error" class="hidden text-center py-4 bg-danger-subtle rounded-4 p-3 border border-danger-subtle animation-fade-in">
                <span class="fs-2">⚠️</span>
                <h3 class="text-danger fw-bold small mt-2">Lỗi Hệ Thống</h3>
                <p id="error-message" class="text-danger small mb-0" style="font-size: 12px;">Thành phố không tồn tại hoặc lỗi kết nối mạng.</p>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
