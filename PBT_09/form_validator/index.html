<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Form Validator - Real-time Vanilla JS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light min-vh-screen d-flex align-items-center justify-content-center py-5">

    <div class="card card-custom p-4 shadow-lg w-100 mx-3" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h2 id="form-title" class="fw-extrabold text-dark mb-1">---</h2>
            <p id="form-subtitle" class="text-muted small">---</p>
        </div>

        <form id="register-form" novalidate>
            
            <div class="mb-3 position-relative">
                <label class="form-label fw-semibold text-secondary small">Họ và tên</label>
                <div class="input-group-custom">
                    <input type="text" id="input-name" class="form-control form-control-custom" placeholder="Nhập tên của bạn...">
                    <span class="feedback-icon" id="icon-name"></span>
                </div>
                <div class="error-text" id="err-name"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Địa chỉ Email</label>
                <div class="input-group-custom">
                    <input type="email" id="input-email" class="form-control form-control-custom" placeholder="name@example.com">
                    <span class="feedback-icon" id="icon-email"></span>
                </div>
                <div class="error-text" id="err-email"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                <div class="input-group-custom">
                    <input type="password" id="input-password" class="form-control form-control-custom" placeholder="Nhập mật khẩu an toàn...">
                    <span class="feedback-icon" id="icon-password"></span>
                </div>
                <div class="mt-2">
                    <div class="progress progress-custom">
                        <div id="password-strength-bar" class="progress-bar transition-all" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div id="password-strength-text" class="text-muted text-end small fw-semibold mt-1" style="font-size: 11px;">Mật khẩu trống</div>
                </div>
                <div class="error-text" id="err-password"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small">Xác nhận mật khẩu</label>
                <div class="input-group-custom">
                    <input type="password" id="input-confirm" class="form-control form-control-custom" placeholder="Nhập lại mật khẩu phía trên...">
                    <span class="feedback-icon" id="icon-confirm"></span>
                </div>
                <div class="error-text" id="err-confirm"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small">Số điện thoại</label>
                <div class="input-group-custom">
                    <input type="text" id="input-phone" class="form-control form-control-custom" placeholder="0901-234-567" maxlength="12">
                    <span class="feedback-icon" id="icon-phone"></span>
                </div>
                <div class="error-text" id="err-phone"></div>
            </div>

            <button type="submit" id="btn-submit" class="btn btn-submit-custom w-100 py-2.5 fw-bold transition-all" disabled>
                Đăng Ký Tài Khoản
            </button>
        </form>
    </div>

    <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 24px;">
                <div class="modal-body p-4 text-center">
                    <div class="fs-1 mb-2">🎉</div>
                    <h4 class="fw-extrabold text-success mb-3">Đăng Ký Thành Công!</h4>
                    <p class="text-muted small mb-4">Hệ thống đã ghi nhận thông tin tài khoản của bạn chính xác.</p>
                    
                    <div class="text-start bg-light p-3 rounded-4 border mb-4 text-secondary small">
                        <div class="mb-1"><strong>Họ tên:</strong> <span id="summary-name"></span></div>
                        <div class="mb-1"><strong>Email:</strong> <span id="summary-email"></span></div>
                        <div><strong>Điện thoại:</strong> <span id="summary-phone"></span></div>
                    </div>
                    
                    <button type="button" class="btn btn-secondary px-4 fw-bold rounded-3" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
